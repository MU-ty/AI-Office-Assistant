version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: office_assistant_postgres
    environment:
      POSTGRES_USER: office_user
      POSTGRES_PASSWORD: office_password
      POSTGRES_DB: office_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - office_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office_user -d office_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: office_assistant_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - office_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Weaviate向量数据库
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: office_assistant_weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - office_network

volumes:
  postgres_data:
  redis_data:
  weaviate_data:

networks:
  office_network:
    driver: bridge
