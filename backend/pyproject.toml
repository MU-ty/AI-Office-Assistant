[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "office-assistant-backend"
version = "1.0.0"
description = "AI-powered office assistant backend API"
requires-python = ">=3.10"
authors = [
    {name = "Technology Team", email = "tech@office-assistant.com"}
]

[project.dependencies]
# Web框架
fastapi = ">=0.104.0"
uvicorn = ">=0.24.0"
python-multipart = ">=0.0.6"

# 数据库
sqlalchemy = ">=2.0.0"
asyncpg = ">=0.29.0"
alembic = ">=1.13.0"

# 数据验证
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
email-validator = ">=2.0.0"

# 认证和安全
passlib = ">=1.7.4"
python-jose = ">=3.3.0"
bcrypt = ">=4.1.0"
PyJWT = ">=2.8.0"

# Redis和缓存
redis = ">=5.0.0"
aioredis = ">=2.0.1"

# 异步任务
celery = ">=5.3.0"
kombu = ">=5.3.0"

# 日志
structlog = ">=23.2.0"
loguru = ">=0.7.0"

# HTTP客户端
httpx = ">=0.25.0"
aiohttp = ">=3.9.0"

# 文档生成
reportlab = ">=4.0.0"
python-docx = ">=1.1.0"

# AI/ML 库
transformers = ">=4.35.0"
torch = ">=2.1.0"
spacy = ">=3.7.0"
jieba = ">=0.42.1"
sentence-transformers = ">=2.2.0"
langdetect = ">=1.0.9"

# 音频处理
librosa = ">=0.10.0"
soundfile = ">=0.12.1"
openai-whisper = ">=20231117"
ffmpeg-python = ">=0.2.0"
pydub = ">=0.25.1"
imageio-ffmpeg = ">=0.4.9"
dashscope = ">=1.14.0"

# 文件处理
pydantic-extra-types = ">=2.3.0"
python-pptx = ">=0.6.23"
pdf2image = ">=1.16.3"
pdfplumber = ">=0.10.0"
PyPDF2 = ">=3.0.0"
docx = ">=0.2.3"
openpyxl = ">=3.1.0"

# 工具库
python-dotenv = ">=1.0.0"
pytz = ">=2023.3"
tenacity = ">=8.2.0"

# 测试
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
httpx-mock = ">=0.3.0"

# 代码质量
black = ">=23.12.0"
flake8 = ">=6.1.0"
mypy = ">=1.7.0"
isort = ">=5.13.0"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]

gpu = [
    "torch[cuda]>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=app --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/site-packages/*",
]
