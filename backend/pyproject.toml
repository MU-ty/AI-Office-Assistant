[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "office-assistant-agent"
version = "0.1.0"
description = "Office Assistant Agent - 学术与职场场景智能支持系统"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Office Assistant Team", email = "team@officeassistant.com"}
]
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    "redis>=5.0.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "openai>=1.3.0",
    "dashscope>=1.14.0",
    "python-pptx>=0.6.21",
    "python-docx>=0.8.11",
    "PyPDF2>=3.0.0",
    "pdf2image>=1.16.0",
    "pillow>=10.0.0",
    "httpx>=0.25.0",
    "aiofiles>=23.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.30.0",
    "python-multipart>=0.0.6",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0"
]

[project.optional-dependencies]
dev = [
    "black>=23.10.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest-cov>=4.1.0",
    "isort>=5.12.0"
]

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
